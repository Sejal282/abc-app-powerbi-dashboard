<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ABC APP Power BI Dashboard</title>

<style>

body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#f4f6f9;
    color:#222;
}

header{
    background:#111827;
    color:white;
    text-align:center;
    padding:30px;
}

header h1{
    margin:0;
    font-size:40px;
}

header p{
    margin-top:10px;
    font-size:18px;
}

.container{
    width:90%;
    margin:auto;
    padding:40px 0;
}

.section-title{
    text-align:center;
    margin-bottom:40px;
}

.dashboard{
    background:white;
    margin-bottom:50px;
    padding:20px;
    border-radius:15px;
    box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

.dashboard h2{
    margin-bottom:20px;
}

.dashboard img{
    width:100%;
    border-radius:10px;
}

.links{
    text-align:center;
    margin-top:50px;
}

.links a{
    display:inline-block;
    margin:10px;
    padding:12px 20px;
    background:#2563eb;
    color:white;
    text-decoration:none;
    border-radius:8px;
}

.links a:hover{
    background:#1d4ed8;
}

footer{
    background:#111827;
    color:white;
    text-align:center;
    padding:20px;
    margin-top:50px;
}

</style>

</head>

<body>

<header>
    <h1>ABC APP Ecosystem Dashboard</h1>
    <p>Power BI Data Analytics Project</p>
</header>

<div class="container">

    <div class="section-title">
        <h1>Dashboard Screenshots</h1>
    </div>

    <div class="dashboard">
        <h2>Main Dashboard</h2>
        <img src="Screenshots/Dashboard.png" alt="Dashboard">
    </div>

    <div class="dashboard">
        <h2>Main Analytics Dashboard</h2>
        <img src="Screenshots/Main_Dasboard.png" alt="Main Dashboard">
    </div>

    <div class="dashboard">
        <h2>Revenue Dashboard</h2>
        <img src="Screenshots/Revenue_Dashboard.png" alt="Revenue Dashboard">
    </div>

    <div class="dashboard">
        <h2>Token Dashboard</h2>
        <img src="Screenshots/Token_Dashboard.png" alt="Token Dashboard">
    </div>

    <div class="dashboard">
        <h2>User Dashboard</h2>
        <img src="Screenshots/User_Dashboard.png" alt="User Dashboard">
    </div>

    <div class="links">

        <a href="Dashboard.pbix">
            Download PBIX File
        </a>

        <a href="ABC%20App%20Ecosystem%20Dashboard.pptx">
            Download Presentation
        </a>

    </div>

</div>

<footer>
    <p>Created by Sejal Kale</p>
</footer>

</body>
</html>
